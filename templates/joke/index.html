<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#05070c;color:#e9eef8;padding:20px;
    background-image:radial-gradient(ellipse 800px 600px at 20% 10%, rgba(167,139,250,.18) 0%, transparent 55%);
  }
  .box{
    background:#0f1420;border:1px solid #1b2333;border-radius:16px;
    padding:36px 32px;max-width:420px;width:100%;position:relative;overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
  }
  .box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,#a78bfa,#22d3ee);}
  .icon{font-size:48px;text-align:center;margin-bottom:14px}
  h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
  .sub{font-size:12.5px;color:#5b6884;text-align:center;margin-bottom:26px;
    font-family:'JetBrains Mono',monospace}
  label{display:block;font-size:12px;font-weight:600;color:#96a3ba;margin-bottom:8px}
  input{width:100%;padding:12px 15px;background:#0a0d16;border:1px solid #1b2333;
    border-radius:10px;color:#e9eef8;font-size:14px;font-family:inherit;outline:none}
  input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.13)}
  button{width:100%;padding:12px;margin-top:16px;border:none;border-radius:10px;
    background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#fff;font-weight:700;
    font-size:14px;cursor:pointer;font-family:inherit}
  #result{margin-top:16px;padding:14px;border-radius:10px;text-align:center;
    font-size:14px;line-height:1.6;display:none}
  #result.show{display:block}
  #result.error{background:rgba(244,63,94,.12);color:#f43f5e;
    border:1px solid rgba(244,63,94,.3);font-weight:600}
  #result.success{background:rgba(34,211,238,.12);color:#22d3ee;
    border:1px solid rgba(34,211,238,.3);font-weight:700;font-size:16px}
</style>
</head>
<body>
<form class="box" id="form">
  <div class="icon">🔐</div>
  <h1>Admin Access</h1>
  <div class="sub">RESTRICTED AREA</div>
  <label for="pw">Password</label>
  <input id="pw" type="password" required autofocus autocomplete="off">
  <button type="submit">Unlock</button>
  <div id="result"></div>
</form>
<script>
const form = document.getElementById('form');
const resultEl = document.getElementById('result');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('pw').value;
  try {
    const r = await fetch('/api/joke-login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password })
    });
    const j = await r.json();
    resultEl.className = j.ok ? 'show success' : 'show error';
    resultEl.textContent = j.ok ? j.message : j.error;
  } catch (err) {
    resultEl.className = 'show error';
    resultEl.textContent = 'خطای ارتباط';
  }
});
</script>
</body>
</html>
